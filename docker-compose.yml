# Postgres de desenvolvimento para o BROTA.
# Uso:  docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: brota-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: brota
      POSTGRES_PASSWORD: brota
      POSTGRES_DB: brota
    ports:
      - '5432:5432'
    volumes:
      - brota-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U brota -d brota']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  brota-db-data:
